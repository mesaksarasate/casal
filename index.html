<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F5F3F4">
<meta name="description" content="Persuadir Casal">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px;font-family:system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Persuadir Casal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Young+Serif&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400,0..1,0&display=block">
</head>
<body>
<style>
/* Layout: Material 3 no padrão do Persuadir Finanças (fundo neutro, cartões de 12, cartão principal sólido) com estrutura e termos próprios. Celular: barra superior + barra inferior; computador: navegação lateral. */
:root{
  --bg:#F5F5F5; --surface:#FFFFFF; --surface-2:#ECECEE; --surface-3:#E3E3E6; --fg:#1B1B1F; --muted:#636363; --line:#DADCE0; --outline:#79747E;
  --primary:#A3324A; --on-primary:#FFFFFF; --pc:#FFDDE2; --on-pc:#3E0716;
  --hero:#5A1A2B; --on-hero:#FBEBEE; --hero-2:#E9C3CB;
  --good:#1E7A45; --good-soft:#D7F0DF; --warn:#7A5A00; --warn-soft:#FBEBC2; --bad:#B3261E; --bad-soft:#F9DEDC; --sos:#C8102E; --sos-2:#8E0B20;
  --scrim:rgba(0,0,0,.32); --e1:0 1px 2px rgba(0,0,0,.3),0 1px 3px 1px rgba(0,0,0,.15); --e3:0 4px 8px 3px rgba(0,0,0,.15),0 1px 3px rgba(0,0,0,.3);
  --f-brand:"Young Serif",Georgia,serif; --f-body:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121214; --surface:#1C1B1F; --surface-2:#25242A; --surface-3:#2E2D33; --fg:#E6E1E5; --muted:#AAA6AF; --line:#3A3940; --outline:#938F99;
  --primary:#FFB1BE; --on-primary:#5E1124; --pc:#7A2338; --on-pc:#FFD9DF; --hero:#3A1220; --on-hero:#FBEBEE; --hero-2:#D9A9B4;
  --good:#7DD6A0; --good-soft:#11391F; --warn:#F1C35A; --warn-soft:#3D2F00; --bad:#F2B8B5; --bad-soft:#601410; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121214; --surface:#1C1B1F; --surface-2:#25242A; --surface-3:#2E2D33; --fg:#E6E1E5; --muted:#AAA6AF; --line:#3A3940; --outline:#938F99;
  --primary:#FFB1BE; --on-primary:#5E1124; --pc:#7A2338; --on-pc:#FFD9DF; --hero:#3A1220; --on-hero:#FBEBEE; --hero-2:#D9A9B4;
  --good:#7DD6A0; --good-soft:#11391F; --warn:#F1C35A; --warn-soft:#3D2F00; --bad:#F2B8B5; --bad-soft:#601410; color-scheme:dark}
:root[data-hc="1"]{--muted:var(--fg);--line:var(--outline)}
*,*::before,*::after{box-sizing:border-box}
*{-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--fg)}
body{margin:0;font:400 14px/20px var(--f-body);letter-spacing:.2px;font-feature-settings:"tnum" 1,"cv11" 1;-webkit-font-smoothing:antialiased;overflow-x:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(104px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:13;background:var(--bg)}
.wrap{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:16px;width:100%;min-width:0}
.app[data-big="1"]{zoom:1.12}
h1,h2,h3{margin:0;text-wrap:balance}
h1{font-size:24px;line-height:32px;font-weight:400}
h2{font-size:16px;line-height:24px;font-weight:500;letter-spacing:.15px}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.muted{color:var(--muted)} .small{font-size:12px;line-height:16px;letter-spacing:.4px}
.ms{font-family:"Material Symbols Rounded";font-weight:normal;font-style:normal;font-size:24px;line-height:1;display:inline-block;white-space:nowrap;direction:ltr;font-feature-settings:"liga";-webkit-font-feature-settings:"liga";font-variation-settings:"FILL" 0,"wght" 400,"GRAD" 0,"opsz" 24;width:24px;height:24px;overflow:hidden;flex:none;user-select:none;text-align:center}
.ms.f{font-variation-settings:"FILL" 1,"wght" 400,"GRAD" 0,"opsz" 24}
.ms.s{font-size:20px;width:20px;height:20px}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}
@keyframes enter{from{opacity:0;transform:translateX(14px)}}
@keyframes up{from{transform:translateY(100%)}}
@keyframes fade{from{opacity:0}}
@keyframes pulse{50%{transform:scale(1.15)}}
@keyframes blink{50%{opacity:.55}}
@keyframes pop{from{transform:scale(.6);opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes swapIn{from{opacity:0;transform:translateX(18px)}}
@keyframes ring{0%{box-shadow:inset 0 0 0 2px var(--primary),0 0 0 0 color-mix(in srgb,var(--primary) 40%,transparent)}100%{box-shadow:inset 0 0 0 2px var(--primary),0 0 0 12px transparent}}
@keyframes blinkE{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.12)}}
@keyframes bob{50%{transform:translateY(-1.2px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.view{animation:enter .25s cubic-bezier(.2,0,0,1)}
.view .rise{animation:rise .32s cubic-bezier(.2,0,0,1) both}

/* barra superior */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:12;background:var(--bg);min-height:64px;display:flex;align-items:center;justify-content:space-between;gap:8px;margin-inline:-16px;padding:0 4px 0 16px}
.brand{display:flex;align-items:baseline;gap:8px;line-height:1}
.brand b{font-family:var(--f-brand);font-weight:400;font-size:27px;color:var(--primary);letter-spacing:-.01em}
.brand span{font-size:14px;font-weight:600;color:var(--muted);letter-spacing:.01em}
.topacts{display:flex;align-items:center}
.iconbtn{width:48px;height:48px;border-radius:50%;border:0;background:none;display:grid;place-items:center;flex:none;color:var(--muted);position:relative}
.iconbtn:hover{background:color-mix(in srgb,var(--fg) 8%,transparent)}
.iconbtn.sos{color:var(--sos)}
.bbadge{position:absolute;top:8px;right:8px;min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--bad);color:#fff;font-size:11px;font-weight:500;line-height:16px;text-align:center}
:root[data-theme="dark"] .bbadge{color:var(--bad-soft)}
.mebtn{border:0;background:none;display:flex;align-items:center;gap:6px;height:40px;padding:0 10px 0 4px;border-radius:20px;color:var(--fg);font-size:12px;font-weight:500}
.mebtn:hover{background:color-mix(in srgb,var(--fg) 8%,transparent)}
.avw{position:relative;display:inline-grid;flex:none}
.sdot{position:absolute;right:-1px;bottom:-1px;width:12px;height:12px;border-radius:50%;border:2px solid var(--bg);background:var(--muted)}
.sdot.online{background:var(--good)}.sdot.ocupado,.sdot.trab{background:var(--bad)}.sdot.ausente{background:#E3A23B}.sdot.offline{background:var(--outline)}
.card .sdot,.sheet .sdot{border-color:var(--surface)}

/* avatar animado */
.avt{width:var(--s,40px);height:var(--s,40px);border-radius:50%;overflow:hidden;display:grid;place-items:center;flex:none;background:var(--c,var(--pc))}
.avt img{width:100%;height:100%;object-fit:cover}
.avt svg{width:100%;height:100%}
.avt .ey{transform-box:fill-box;transform-origin:center;animation:blinkE 4.6s infinite}
.avt .bob{animation:bob 3.4s ease-in-out infinite}
.avt.ini{font:600 calc(var(--s,40px)*.42) var(--f-body);color:var(--on-pc)}

/* cartão animado (inteligente) */
.hero{background:var(--hero);color:var(--on-hero);border-radius:28px;padding:22px 22px 16px;position:relative;overflow:hidden;display:flex;flex-direction:column;gap:6px;transition:background .3s}
.hero::after{content:"";position:absolute;right:-40px;top:-40px;width:150px;height:150px;border-radius:50%;background:color-mix(in srgb,var(--on-hero) 7%,transparent);animation:pulse 4.5s ease-in-out infinite}
.hero.sos{background:var(--sos)}
.hero.sos::after{background:rgba(255,255,255,.14);animation-duration:1.2s}
.hero .slide{display:flex;flex-direction:column;gap:6px;position:relative;z-index:1;animation:swapIn .35s cubic-bezier(.2,0,0,1)}
.hero .cap{display:flex;align-items:center;gap:8px;color:var(--hero-2);font-size:14px;font-weight:500}
.hero.sos .cap{color:#fff}
.hero .big{font-size:36px;line-height:44px;font-weight:600;letter-spacing:-.02em}
.hero .big.m{font-size:26px;line-height:32px}
.hero .sub{color:var(--hero-2);font-size:14px}
.hero.sos .sub{color:#fff}
.hero .btn.tonal{align-self:flex-start;border:0;background:color-mix(in srgb,var(--on-hero) 16%,transparent);color:var(--on-hero);margin-top:8px}
.dots{display:flex;gap:6px;justify-content:center;margin-top:10px;position:relative;z-index:1}
.dots button{width:8px;height:8px;border-radius:4px;border:0;padding:0;background:color-mix(in srgb,var(--on-hero) 35%,transparent);transition:width .2s}
.dots button.on{width:20px;background:var(--on-hero)}
.lvl{display:flex;align-items:center;gap:12px;margin-top:10px;background:color-mix(in srgb,var(--on-hero) 10%,transparent);border:0;color:var(--on-hero);border-radius:16px;padding:10px 12px;width:100%;text-align:left}
.lvl b{display:block;font-size:15px;font-weight:600}.lvl small{font-size:12px;color:var(--hero-2)}
.lvl .bdg{box-shadow:0 0 0 3px color-mix(in srgb,var(--on-hero) 40%,transparent)}
.bar{height:4px;border-radius:2px;background:color-mix(in srgb,var(--on-hero) 18%,transparent);margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--on-hero);border-radius:2px}
.who2{display:flex;align-items:center;gap:8px;color:var(--hero-2);font-size:13px;margin-top:4px}

/* bodas */
.bdg{--c:var(--primary);width:var(--s,44px);height:var(--s,44px);border-radius:50%;background:var(--c);display:grid;place-items:center;flex:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 22%,transparent)}
.bdg svg{width:58%;height:58%;fill:#fff;fill-rule:evenodd}
.bdg .d{fill:none;stroke:var(--c);stroke-width:1.4;stroke-linecap:round}
.bdg .h{fill:var(--c);opacity:.35}
.bdg.off{background:var(--surface-2);box-shadow:none}.bdg.off svg{fill:var(--muted);opacity:.55}.bdg.off .d{stroke:var(--surface-2)}.bdg.off .h{fill:var(--muted);opacity:.3}
.levels{display:flex;gap:14px;overflow-x:auto;padding:4px 2px 6px;scrollbar-width:none}
.levels::-webkit-scrollbar{display:none}
.lv{display:flex;flex-direction:column;align-items:center;gap:6px;width:72px;flex:none;text-align:center;font-size:11px;font-weight:600;line-height:1.25;background:none;border:0;color:var(--fg);padding:0}
.lv span{font-weight:400;color:var(--muted)}

/* cartões e listas */
.card{background:var(--surface);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card.now{animation:ring 1.8s ease-out .3s 3;box-shadow:inset 0 0 0 2px var(--primary)}
.ch{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:32px}
.ch .muted{font-size:13px}
.lgroup{background:var(--surface);border-radius:12px;padding:0 16px}
.lst{width:100%;min-height:56px;display:flex;align-items:center;gap:16px;border:0;background:none;padding:8px 0;text-align:left;color:var(--fg);font-size:14px;line-height:20px}
.lst+.lst{border-top:1px solid var(--line)}
.lst>.ms{color:var(--muted)}
.lst .r{margin-left:auto;color:var(--muted);font-size:13px;white-space:nowrap;display:flex;align-items:center;gap:4px}
.lst .t{flex:1;min-width:0}
.lst .t small{display:block;color:var(--muted);font-size:12px;line-height:16px;margin-top:2px}
.lead{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--pc);color:var(--on-pc);flex:none}
.lead.ok{background:var(--good-soft);color:var(--good)}.lead.warn{background:var(--warn-soft);color:var(--warn)}.lead.mute{background:var(--surface-2);color:var(--muted)}.lead.bad{background:var(--bad-soft);color:var(--bad)}
.done .t>b,.done .t>span{text-decoration:line-through;color:var(--muted)}
.empty{text-align:center;padding:20px 12px;color:var(--muted);font-size:14px}
.note{padding:10px 12px;border-radius:8px;background:var(--surface-2);font-size:13px;line-height:18px}
.note.warn{background:var(--warn-soft);color:var(--warn)}.note.bad{background:var(--bad-soft);color:var(--bad)}.note.ok{background:var(--good-soft);color:var(--good)}
.chip{display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 8px;border-radius:8px;font-size:12px;font-weight:500;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.chip.ok{background:var(--good-soft);color:var(--good)}.chip.warn{background:var(--warn-soft);color:var(--warn)}.chip.pc{background:var(--pc);color:var(--on-pc)}
.gtitle{font-size:12px;font-weight:500;letter-spacing:.5px;color:var(--muted);margin:8px 0 -8px 4px}
.money{font-size:28px;line-height:36px;font-weight:600;letter-spacing:-.01em}

/* avisos de contexto */
.aviso{display:grid;grid-template-columns:52px minmax(0,1fr);gap:14px;align-items:center;background:var(--surface);border-radius:12px;padding:12px 16px 12px 12px}
.aviso .ill{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:var(--pc);color:var(--on-pc)}
.aviso .ill .ms{font-size:28px;width:28px;height:28px;font-variation-settings:"FILL" 1,"wght" 400,"GRAD" 0,"opsz" 40}
.aviso .tt{font-size:15px;line-height:22px;font-weight:500}
.aviso .dd{font-size:13px;color:var(--muted)}

/* botões */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:8px 24px;border-radius:20px;border:1px solid var(--outline);background:transparent;color:var(--primary);font-size:14px;font-weight:500;letter-spacing:.1px;text-align:center;line-height:20px}
.btn .ms{font-size:18px;width:18px;height:18px;margin-left:-8px}
.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.btn.tonal{background:var(--pc);border-color:transparent;color:var(--on-pc)}
.btn.text{border-color:transparent;padding:8px 12px}
.btn.danger{background:var(--sos);border-color:var(--sos);color:#fff}
.btn.sm{min-height:34px;padding:4px 16px;font-size:13px}
.btn.xl{min-height:52px;border-radius:26px;font-size:15px;width:100%}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.cbtn{width:36px;height:36px;border-radius:50%;border:1px solid var(--outline);background:transparent;display:grid;place-items:center;color:var(--muted);flex:none}
.cbtn.on{background:var(--good);border-color:var(--good);color:var(--surface)}
.fab{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(96px + env(safe-area-inset-bottom,0px));z-index:9;height:56px;padding:0 20px 0 16px;border-radius:16px;border:0;background:var(--pc);color:var(--on-pc);font-size:14px;font-weight:500;display:inline-flex;align-items:center;gap:12px;box-shadow:var(--e3);animation:rise .3s both}
.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.quick button{border:0;background:var(--surface);border-radius:12px;padding:14px 6px;display:flex;flex-direction:column;align-items:center;gap:8px;font-size:12px;font-weight:500;color:var(--fg);transition:transform .15s}
.quick button:active{transform:scale(.95)}

/* campos */
label{display:flex;flex-direction:column;gap:6px;font-size:12px;line-height:16px;letter-spacing:.4px;color:var(--muted)}
input[type=text],input[type=email],input[type=password],input[type=tel],input[type=date],input[type=time],input[type=number],input[type=datetime-local],select,textarea{background:transparent;border:1px solid var(--outline);border-radius:4px;min-height:56px;padding:14px 16px;font-size:16px;line-height:24px;color:var(--fg);width:100%;min-width:0}
input:focus,select:focus,textarea:focus{border:2px solid var(--primary);padding:13px 15px;outline:none}
.row{display:flex;gap:12px;flex-wrap:wrap}.row>*{flex:1 1 140px;min-width:0}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg button{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 16px;border:1px solid var(--outline);border-radius:8px;background:transparent;font-size:14px;font-weight:500;color:var(--muted)}
.seg button.on{background:var(--pc);border-color:transparent;color:var(--on-pc);padding-left:8px}
.seg button.on::before{content:"check";font-family:"Material Symbols Rounded";font-size:18px;line-height:1;font-feature-settings:"liga";-webkit-font-feature-settings:"liga"}
.sw{width:52px;height:32px;border-radius:16px;border:2px solid var(--outline);background:var(--surface-2);position:relative;flex:none;padding:0}
.sw::after{content:"";position:absolute;top:6px;left:6px;width:16px;height:16px;border-radius:50%;background:var(--outline);transition:all .2s}
.sw[aria-checked="true"]{background:var(--primary);border-color:var(--primary)}
.sw[aria-checked="true"]::after{top:2px;left:22px;width:24px;height:24px;background:var(--on-primary)}
.err{color:var(--bad);font-size:12px;font-weight:500}

/* entrada (Entrar / Criar conta) */
.onb{display:flex;flex-direction:column;gap:16px;padding-top:12px}
.ocard{background:var(--surface);border-radius:28px;padding:28px 20px 22px;display:flex;flex-direction:column;gap:18px;animation:rise .3s both}
.appic{display:block;width:64px;height:64px;margin:0 auto -6px;border-radius:15px;box-shadow:0 6px 16px -8px rgba(30,35,40,.45)}
.lock .appic{margin-bottom:10px}
.ocard .word{display:flex;align-items:baseline;justify-content:center;gap:10px}
.ocard .word b{font-family:var(--f-brand);font-weight:400;font-size:36px;color:var(--primary);line-height:1}
.ocard .word span{font-size:16px;font-weight:600;color:var(--muted)}
.ocard h1{font-size:22px;line-height:28px;text-align:center}
.otabs{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--outline);border-radius:20px;overflow:hidden}
.otabs button{min-height:40px;border:0;background:none;font-weight:500;font-size:14px;display:flex;align-items:center;justify-content:center;gap:6px;color:var(--fg)}
.otabs button+button{border-left:1px solid var(--outline)}
.otabs button.on{background:var(--pc);color:var(--on-pc)}
.otabs button.on::before{content:"check";font-family:"Material Symbols Rounded";font-size:18px;line-height:1;font-feature-settings:"liga";-webkit-font-feature-settings:"liga"}
.stages{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:12px;padding:14px 8px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:14px;font-weight:500;text-align:center;transition:transform .15s}
.tile:active{transform:scale(.95)}
.tile small{font-weight:400;font-size:12px;color:var(--muted)}
.tile.on{border:2px solid var(--primary);padding:13px 7px;background:color-mix(in srgb,var(--primary) 6%,var(--surface))}
.code{font-size:30px;line-height:38px;font-weight:600;letter-spacing:.2em;text-align:center;padding:12px;border-radius:12px;background:var(--surface-2)}
.pend{display:flex;align-items:center;gap:10px;justify-content:center;color:var(--muted)}
.pend i{width:8px;height:8px;border-radius:50%;background:var(--primary);animation:blink 1s infinite}

/* perfil */
.acct{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.acct b{display:block;font-size:16px;line-height:24px;font-weight:500}
.acct .user{display:block;color:var(--muted);font-size:12px}
.role{display:inline-flex;align-items:center;gap:6px;margin-top:6px;height:24px;padding:0 8px 0 3px;border-radius:12px;font-size:12px;font-weight:500;background:var(--pc);color:var(--on-pc)}
.cover{height:130px;border-radius:12px;position:relative;margin-bottom:38px;background-size:cover;background-position:center}
.cover .avw{position:absolute;left:16px;bottom:-34px;border-radius:50%;box-shadow:0 0 0 4px var(--surface)}

const IA_REGRAS=`Você é o assistente do Persuadir Casal, app privado de um casal. Você ajuda em qualquer assunto do dia a dia: saúde e remédios, casa, compras, veículo, relacionamento, fé, trabalho, bebê e o que mais perguntarem. Responda em português do Brasil, de forma prática e calorosa, em até 150 palavras, salvo se pedirem mais.
Primeiro responda exatamente o que foi perguntado e explique: o que é, para que serve, como funciona. Cuidados e avisos vêm depois da explicação, nunca no lugar dela.
Remédios: explique como uma bula comentada (princípio ativo, para que serve, como age, efeitos comuns, contraindicações e interações importantes). Pode informar a posologia usual que consta na bula para adultos, dizendo que a dose certa é a da bula ou da receita e que o farmacêutico ou o médico confirma. Não diagnostique nem prescreva para um caso específico.
Dados do casal: use só quando mudarem a resposta e aplique cada dado à pessoa certa. A gestação e o pós-parto são da pessoa indicada nos dados, não de quem pergunta. Se a pergunta envolver a gestante, a amamentação ou o bebê, explique normalmente e acrescente no fim um aviso curto e específico (por exemplo, se o remédio é contraindicado na gravidez), sem recusar a explicação.
Quando a pergunta for geral (não fala da gestante, da gravidez, da amamentação ou do bebê), responda de forma geral, como para qualquer adulto, sem avisos de gravidez. Nunca recuse explicar um remédio, um sintoma ou um assunto de saúde; não diga que "não tem como" explicar.

    <div class="cropBar"><button class="iconbtn" data-a="cropZ" data-v="-1" aria-label="Diminuir">${ms("remove")}</button><input type="range" id="cropZoom" min="1" max="4" step="0.01" value="${CR.z}" aria-label="Zoom"><button class="iconbtn" data-a="cropZ" data-v="1" aria-label="Aumentar">${ms("add")}</button><button class="iconbtn" data-a="cropRot" aria-label="Girar">${ms("rotate_right")}</button><button class="iconbtn" data-a="cropReset" aria-label="Centralizar">${ms("center_focus_strong")}</button></div>`;

  case "vac":{const v=el.dataset.v;if(S.vac[v])delete S.vac[v];else{S.vac[v]=today();notify(outro(),"vaccines",`${nm(me)} registrou a vacina ${v}`)}save();render();fx("ok");break}
  case "nascReset":S.bebeNasc=null;save();render();break;
  case "cicloRetomar":S.ciclo.pausado=false;S.ciclo.reg=[iso(now-66*DAY),iso(now-37*DAY),iso(now-8*DAY)];S.ciclo.exemplo=true;save();render();fx("ok");break;
  case "cicloIni":{const d=$("#cIniD").value||today();if(S.ciclo.exemplo){S.ciclo.reg=[];S.ciclo.exemplo=false}if(!S.ciclo.reg.includes(d))S.ciclo.reg.push(d);if(S.ciclo.share!=="nada")notify(outro(),"cycle",`Ciclo de ${nm(me)} atualizado`);save();render();fx("ok");toast("Registrado");break}
  case "cicloShare":S.ciclo.share=el.dataset.v;save();render();break;
  case "sint":{const L=S.ciclo.sint[today()]||[],v=el.dataset.v;S.ciclo.sint[today()]=L.includes(v)?L.filter(x=>x!==v):L.concat(v);save();render();break}
  case "fluxo":S.ciclo.fluxo[today()]=S.ciclo.fluxo[today()]===el.dataset.v?null:el.dataset.v;save();render();break;
  case "saveMeta":{const t=$("#mTi").value.trim();if(!t){fx("err");$("#mTi").focus();return}const al=numBR($("#mAl").value);S.metas.unshift({id:Date.now(),t,tipo:$("#mTipo").value,etapas:$("#mEt").value.split("\n").map(x=>x.trim()).filter(Boolean).map(x=>({t:x,d:false})),alvo:al>0?al:0,guardado:0,prazo:$("#mPr").value});notify(outro(),"flag",`${nm(me)} criou: ${t}`);save();closeSheet();render();fx("ok");break}
  case "etapa":{const m=S.metas.find(x=>x.id==el.dataset.id),antes=metaProg(m),e=m.etapas[+el.dataset.i];e.d=!e.d;save();render();fx(e.d?"ok":"tap");metaCheck(m,antes);break}
  case "addEtapa":sheetCtx=+el.dataset.id;openSheet("etapa");break;
  case "saveEtapa":{const t=$("#eT").value.trim();if(!t)return;S.metas.find(x=>x.id==sheetCtx).etapas.push({t,d:false});save();closeSheet();render();break}
  case "guardar":sheetCtx=+el.dataset.id;openSheet("guardar");break;
  case "saveGuardar":{const v=numBR($("#gV").value);if(!(v>0)){fx("err");return}const m=S.metas.find(x=>x.id==sheetCtx),antes=metaProg(m);m.guardado=Math.round((m.guardado+v)*100)/100;notify(outro(),"savings",`${nm(me)} guardou ${brl(v)} em ${m.t}`);save();closeSheet();render();fx("ok");metaCheck(m,antes);break}
  case "metaDel":S.metas=S.metas.filter(x=>x.id!=el.dataset.id);save();render();break;
  case "kmSet":{const v=numBR($("#kmIn").value);if(!(v>=S.veiculo.km)){fx("err");toast("Informe um km maior que o atual");return}S.veiculo.km=Math.round(v);S.veiculo.kmLog.push({at:Date.now(),km:S.veiculo.km});save();render();fx("ok");break}
  case "manutOk":{const x=S.veiculo.manut[+el.dataset.i];x.ult=S.veiculo.km;save();render();fx("ok");toast(`${x.t} registrada em ${S.veiculo.km.toLocaleString("pt-BR")} km`);break}
  case "docOk":{const x=S.veiculo.docs[+el.dataset.i];const d=D(x.venc);d.setFullYear(d.getFullYear()+1);x.venc=iso(d);save();render();fx("ok");break}
  case "saveManut":{const t=$("#vT").value.trim(),c=numBR($("#vC").value),u=numBR($("#vU").value);if(!t||!(c>0)){fx("err");toast("Informe o quê e a cada quantos km");return}S.veiculo.manut.push({t,cada:Math.round(c),ult:isFinite(u)?Math.round(u):S.veiculo.km});save();closeSheet();render();fx("ok");break}
  case "iaSug":iaAsk(el.dataset.q);break;
  case "iaPerg":iaAsk($("#iaIn").value);break;
  case "iaNova":if(iaCtl)iaCtl.abort();S.iaCur[me]=null;iaErr="";iaView="chat";$("#iaIn").value="";save();iaBody();break;
  case "iaHist":iaView=iaView==="hist"?"chat":"hist";$("#iaIn").value="";iaBody();break;
  case "iaAbrir":S.iaCur[me]=+el.dataset.id;iaView="chat";iaErr="";save();iaBody();break;
  case "iaDel":{const id=+el.dataset.id;S.iaConv[me]=S.iaConv[me].filter(x=>x.id!==id);if(S.iaCur[me]===id)S.iaCur[me]=null;save();iaBody();break}
  case "iaClose":if(iaCtl)iaCtl.abort();iaClose();break;
  case "iaUndo":{const c=iaConv();if(c)iaUndo(c.msgs[+el.dataset.i]);break}
  case "iaCopy":{const c=iaConv();if(c)copyText(c.msgs[+el.dataset.i].content,el.closest(".tx").querySelector(".md"));break}
  case "iaGo":{const [t,v]=el.dataset.g.split(":");iaClose();sec=null;if(t==="agenda"){agv=v}if(t==="bebe"){S.ges=v}if(t==="docs"){tab="ajustes";sec="docs";render();window.scrollTo(0,0)}else go(t);break}
  case "nClear":S.notif=S.notif.filter(x=>x.to!==me);save();openNotif();break;
  }
}
function copyText(t,el){(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>{toast("Copiado");fx("ok")}).catch(()=>{const r=document.createRange();r.selectNodeContents(el);const s=getSelection();s.removeAllRanges();s.addRange(r);toast("Texto selecionado")})}
$("#fileIn").addEventListener("change",async e=>{const f=e.target.files[0];e.target.value="";if(!f)return;try{const url=await fotoComprimida(f,1600);cropOpen(fotoAlvo==="casal"?"casal":fotoAlvo==="capa"?"capa":"eu",url,true)}catch(_){toast("Não foi possível abrir essa imagem")}});
/* som em todo toque */
document.addEventListener("pointerdown",e=>{if(e.target.closest("button,a,select,input[type=date],input[type=checkbox]")&&!e.target.closest("#sosHold"))fx("tap")},true);
document.addEventListener("click",e=>{const el=e.target.closest("[data-a]");
  if(!$("#notif").hidden&&!e.target.closest("#notif")&&!e.target.closest("#bellBtn"))$("#notif").hidden=true;
  if(e.target.id==="sheet"){closeSheet();return}if(e.target.id==="cel"){$("#cel").hidden=true;return}
  if(el)act(el.dataset.a,el)});
document.addEventListener("change",e=>{const f=e.target.dataset&&e.target.dataset.f;if(f){const [w,k]=f.split(".");(w==="b"?S.bebeFicha:C(w))[k]=e.target.value;save();toast("Ficha atualizada")}if(e.target.id==="dpp"&&e.target.value){S.dpp=e.target.value;save();render()}if(e.target.id==="bNasc"&&e.target.value){S.bebeNasc=e.target.value;notify(outro(),"child_care",`Data de nascimento do bebê registrada`);save();render();fx("cel")}});
$("#bellBtn").onclick=e=>{e.stopPropagation();$("#notif").hidden?openNotif():$("#notif").hidden=true};
$("#chatBtn").onclick=()=>go("chat");
$("#iaOrb").onclick=()=>{const b=$("#iaOrb");if(b._t)return;b.classList.remove("tap");void b.offsetWidth;b.classList.add("tap");fx("tap");b._t=setTimeout(()=>{b.classList.remove("tap");b._t=0;iaOpen()},420)};
$("#meBtn").onclick=()=>openSheet("me");
$$("#tabs button").forEach(b2=>b2.onclick=()=>go(b2.dataset.t));
/* chat */
function send0(o2){S.chat.push(Object.assign({by:me,at:Date.now()},o2));const ja=S.notif.find(x=>x.to===outro()&&x.ic==="chat"&&!x.lido);if(ja){ja.at=Date.now()}else notify(outro(),"chat",`Nova mensagem de ${nm(me)}`);save();render();fx("msg")}
$("#chatForm").addEventListener("submit",e=>{e.preventDefault();const t=$("#chatTxt").value.trim();if(!t)return;$("#chatTxt").value="";send({t})});
$("#emo").addEventListener("click",e=>{if(e.target.tagName==="BUTTON")send({t:e.target.textContent,big:true})});
let recT=null,recS=0;
$("#micBtn").onclick=()=>{if(OF.on)return audioGravar();const b2=$("#micBtn");if(recT){clearInterval(recT);recT=null;b2.classList.remove("rec");send({audio:Math.max(1,recS)});toast("Áudio enviado")}else{recS=0;b2.classList.add("rec");recT=setInterval(()=>{recS++;if(recS>=59)$("#micBtn").click()},1000);toast("Gravando… toque de novo para enviar")}};
/* Preciso de ajuda (segurar) */
let sosT=null,sosStart=0;
document.addEventListener("pointerdown",e=>{if(!e.target.closest("#sosHold"))return;e.preventDefault();sosStart=Date.now();const arc=$("#sosArc");
  sosT=setInterval(()=>{const p=Math.min(1,(Date.now()-sosStart)/2000);arc.setAttribute("stroke-dashoffset",597*(1-p));
    if(p>=1){clearInterval(sosT);sosT=null;S.sos={by:me,at:Date.now()};if(navigator.geolocation)navigator.geolocation.getCurrentPosition(p=>{if(S.sos){S.sos.loc={lat:+p.coords.latitude.toFixed(5),lon:+p.coords.longitude.toFixed(5)};save()}},()=>{},{enableHighAccuracy:true,timeout:15000});S.sosVisto[outro()]=false;S.cfg.loc[me]=true;notify(outro(),"sos",`${nm(me)} pediu ajuda`);save();closeSheet();tab="inicio";heroI=0;render();fx("alert");toast(`Alerta enviado para ${nm(outro())}`)}},30)});
["pointerup","pointercancel"].forEach(ev=>document.addEventListener(ev,()=>{if(sosT){clearInterval(sosT);sosT=null;const a=$("#sosArc");if(a)a.setAttribute("stroke-dashoffset",597)}}));
document.addEventListener("contextmenu",e=>{if(e.target.closest("#sosHold"))e.preventDefault()});
/* alerta de SOS repete até ser visto */
setInterval(()=>{if(S.sos&&S.sos.by!==me&&!S.sosVisto[me]&&logado())fx("alert")},2600);
/* bloqueio */
let pin="";
$("#pad").innerHTML=["1","2","3","4","5","6","7","8","9","","0","⌫"].map(k=>k?`<button data-k="${k}" aria-label="${k==="⌫"?"Apagar":k}">${k}</button>`:"<span></span>").join("");
function pins(){$$("#pins i").forEach((p,i)=>p.classList.toggle("f",i<pin.length))}
$("#pad").addEventListener("click",e=>{const k=e.target.dataset.k;if(!k)return;if(k==="⌫")pin=pin.slice(0,-1);else if(pin.length<4)pin+=k;pins();
  if(pin.length===4){if(String(hash(pin))===(localStorage.getItem("pc-pin-"+OF.uid)||"-")){fx("ok");setTimeout(()=>{$("#lock").hidden=true;pin="";pins()},150)}else{$("#pins").classList.add("shake");fx("err");setTimeout(()=>{$("#pins").classList.remove("shake");pin="";pins()},400)}}});
function lockApp(){pin="";pins();$("#lock").hidden=false}
/* cartão inteligente: troca sozinho */
setInterval(()=>{if(tab!=="inicio"||!ativo()||Date.now()-heroHold<15000||matchMedia("(prefers-reduced-motion: reduce)").matches)return;const L=heroCards();if(L.length<2||L[0].k==="sos")return;heroI=(heroI+1)%L.length;renderHero()},7000);

$("#chatFile").addEventListener("change",e=>{const f=e.target.files[0];e.target.value="";if(f)fotoEnviar(f)});
if(OF.on)bootOficial();else{document.body.insertAdjacentHTML("beforeend",'<div style="position:fixed;inset:0;display:grid;place-items:center;background:#fff;font:16px system-ui;padding:24px;text-align:center;z-index:999">Falta configurar o Firebase no arquivo config.js</div>')}
if("serviceWorker" in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
setInterval(()=>{if(!$("#sheet").hidden||!$("#cel").hidden||document.activeElement&&["INPUT","SELECT","TEXTAREA"].includes(document.activeElement.tagName))return;if(tab!=="chat")render();else badges()},30000);
</script>
</body>
</html>
